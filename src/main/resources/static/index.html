<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3:4b Chat</title>
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #f4f6f8;
      --surface: #fff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    header {
      background: var(--text);
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
    }

    .chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--bg);
    }

    .msg {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      animation: slideIn 0.2s ease-out;
    }

    .user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai {
      background: var(--border);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 0.75rem 1rem;
      background: var(--border);
      border-radius: var(--radius);
      align-self: flex-start;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    .input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--primary); }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Кастомный скроллбар */
    .chatbox::-webkit-scrollbar { width: 8px; }
    .chatbox::-webkit-scrollbar-track { background: transparent; }
    .chatbox::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .chatbox::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
<div class="container">
  <header>Qwen3:4b Chat</header>
  <div class="chatbox" id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Напишите сообщение..." autofocus>
    <button id="btn" onclick="send()">Отправить</button>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.disabled = btn.disabled = true;

    addMsg(text, 'user');
    const loader = addLoader();

    try {
      const res = await fetch(`/ai/chat?prompt=${encodeURIComponent(text)}`);
      if (!res.ok) throw new Error(`Ошибка ${res.status}`);

      const answer = await res.text();
      loader.remove();
      addMsg(answer, 'ai');
    } catch (err) {
      loader.remove();
      addMsg('Ошибка: ' + err.message, 'ai', true);
    } finally {
      input.disabled = btn.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  function addMsg(text, type, error = false) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    if (error) div.style.color = '#dc2626';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addLoader() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }
</script>
</body>
</html>
