spring.application.name=BackendAiSafety
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.chat.temperature=0.6
# Отключаем тайм-аут для асинхронных и долгих запросов (ставим 5 минут)
spring.mvc.async.request-timeout=300000

# Если вы используете Spring WebFlux (под капотом стартера Ollama)
spring.webflux.client.response-timeout=300s

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_safety
spring.datasource.username=aisafety_user
spring.datasource.password=change_me_local_only

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

app.documents.storage-dir=./data/documents